b6_map_protocol:
  # 架构书 §5.8：「validator：JSON Schema + 空字段检测 + 自动重试 1 次 +
  # 连续失败 2 次路由 flash」。
  #
  # 第 4 条**没有按原样实现**：路由 flash 需要云端 API key，用户已明确不提供
  # （llm.large.api_key 仍是占位符（发布版默认留空））。
  # 所以改成「本地降级」：返回合法的空响应 + degraded=true + degraded_reason，
  # 并写 B7 审计。留这个开关是为了让这个决定**可见可改**，而不是藏在代码里。
  #   local_degrade（默认）= 本地降级，降级原因显式返回
  #   disabled           = 同上（语义上表示这条兜底路径关掉）
  # 不接云端的原因与取舍见 services/B6_map_protocol/protocol.py: _degrade_response
  flash_routing: local_degrade
