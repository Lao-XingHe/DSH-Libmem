# 通用排架表（随插件分发 · 与具体用户无关）
#
# 图书馆的书按**分类号**在架上排（书 p.45）：同类挨着，浏览时才能"逛"出相关的东西。
# 插件里对应的是「类目的先后顺序」—— 现在的 browse 是按类名字母序，那不是排架，
# 是字典。这份文件给出一套**跨用户成立**的类目次序（相当于索书号的类目段）。
#
# 只解决"哪一类排在前面"；**二级类目不在这里定义** ——
# 二级名应该由这个用户自己的数据长出来（B8.build_subclasses），
# 那是私版排架，不是公版。

meta:
  version: 1
  scope: general
  updated: "2026-11-01"
  note: "类目次序；私版二级类目由 build_subclasses 从用户数据里长出来"

# 顺序即排架顺序：越靠前越"基础"，越靠后越"个人"。
# 依据：从通用知识工作 → 具体产出 → 个人事务 的收敛方向。
order:
  - 研究与学习
  - 软件与代码
  - 数据与评测
  - 系统与运维
  - 内容与创作
  - 工作与职业
  - 生活与个人
  - 其他

# 类目 → 一句话说明（面板/目录页上显示，避免用户面对光秃秃的类名）
notes:
  研究与学习: 读过的、想弄明白的、还没落地的
  软件与代码: 写的东西、改的 bug、架构决策
  数据与评测: 跑分、对比、基准与结论
  系统与运维: 环境、服务、部署、故障
  内容与创作: 写出来的、画出来的、发出去的
  工作与职业: 与具体岗位/交付/沟通有关的
  生活与个人: 与工作无关的那部分
  其他: 判不出来就先放这里 —— **不硬塞**是这套分类的纪律
