# 通用款目表（随插件分发 · 与具体用户无关）
#
# 这是「公版」：一个装了插件的新用户，在他自己还没建出私人款目表之前，
# 先用这一份把最常见的那批词收敛掉。
#
# 什么样的词**才该**放进来（这是纪律，别破坏）：
#   1. 跨用户、跨行业都成立的**工具名 / 格式名 / 通用概念**；
#   2. 同一个东西的**写法差异**（大小写、连字符、全半角、常见缩写）；
#   3. 不超过 3 个别名 —— 再多就是私人用法了。
#
# 什么**不该**放进来：
#   ✗ 任何人的**项目名 / 人名 / 自造词**（`书房OS`、`LibMEM` 这类属于私人层）；
#   ✗ 需要上下文才能判断关系的词（"上次那个"）；
#   ✗ 靠 AI 猜出来的同义词 —— 猜错了就是错误召回。
#
# 私人层见 `private.yaml`（由 AI 从这个用户的记忆里建出来，可随时重建）。

meta:
  version: 1
  scope: general
  updated: "2026-11-01"
  note: "通用款目：只收跨用户成立的写法差异，不收任何人的项目名"

