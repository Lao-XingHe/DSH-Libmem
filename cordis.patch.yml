# ============================================================================
# dsh-libmem —— bundle 挂载声明
# ============================================================================
# 这是本插件的「挂载声明」。DSH 启动时按 bundle 层叠加各插件的 patch：
# 先 base / web-app 等组合包，再**各个 bundle 自带的 patch**（就是本文件），
# 最后才是 profile 自己的 `cordis.patch.yml`。
#
# 安装（把 <插件目录> 换成你解压后的实际路径）：
#   dsh plugin --profile <profile> add link:<插件目录>
# 例：
#   dsh plugin --profile desktop add link:D:\Plugins\dsh-libmem
# 装完重启 DSH（桌面端就是退出再打开）。
#
# ⚠️ 必须配置的两项（不改的话服务起不来，`libmem_status` 会报启动失败并附日志尾部）：
#   python      —— 装了 fastapi/mcp 依赖的解释器绝对路径；留 `python` 表示走 PATH
#   projectRoot —— 你的「书房 OS v2」目录（**必须含 config.yaml**，它是数据路径解析的根）
#
# 两种配置方式，任选其一：
#   A) 直接改本文件（简单，但升级插件时会与新版冲突）
#   B) 在自己的 profile patch 里**按 id 覆盖**（推荐，升级不冲突）—— 见 README「装完必做」
# ============================================================================

- insert:
    - id: libmem
      name: dsh-libmem
      config:
        # ---- 必填 ----
        # 例：'C:\Users\you\AppData\Local\Programs\Python\Python312\python.exe'
        python: 'python'
        # 例：'D:\shufang-os\v2'（该目录下应有 config.yaml / services / mcp_tools / data）
        projectRoot: ''

        # ---- 一般不用改 ----
        host: '127.0.0.1'
        port: 8768
        manageProcess: true
        reuseExisting: true
        startTimeoutMs: 90000
        toolCallTimeoutMs: 120000
        # ★ 冷库轮询（B1 → B2 温提炼）必须 true：关掉的话冷库照常增长，
        #   而温提炼永远不再触发 —— 不报错，只是新记忆搜不到。
        bridgePoller: true
        registerTools: true
        toolPrefix: 'libmem'

        # ---- 自动回忆（插件自己判断这句对话要不要翻记忆）----
        recall:
          enabled: true
          # smart（按规则）/ always（每条都翻）/ off（不自动翻）
          mode: 'smart'
          maxItems: 5
          maxChars: 1200

        # ---- 写入侧（B1 冷库）----
        # 留空项会落到插件自己的默认值（状态文件写在插件目录里）。
        write:
          enabled: true
          projectRoot: ''
          vault: ''
          poll: true
